<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MATC EMS Scenario Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: fixed library rail on the left, scenario sheet on the right; the monitor strip is the one dark "device" surface. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #17202b;
  --ink-2: #445263;
  --muted: #6b7889;
  --line: #dde3ea;
  --line-2: #c9d2dc;
  --accent: #1d5fb8;
  --accent-soft: #e5eefa;
  --sel: #eef3fb;
  --crit: #c2362b; --crit-soft: #fbe9e7;
  --imp: #b7740b; --imp-soft: #fbf1df;
  --supp: #5b6b7d; --supp-soft: #eef1f4;
  --ok: #217a4b; --ok-soft: #e3f3ea;
  --vt: #6a3fb5; --vt-soft: #efe8fa;
  --mon-bg: #0c1117; --mon-line: #232c37; --mon-dim: #6f7c8a;
  --display: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --body: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --surface: #161d25; --ink: #e6ebf1; --ink-2: #b4c0cd; --muted: #8593a3;
    --line: #26303b; --line-2: #34404d; --accent: #6ea8f2; --accent-soft: #1a2a40; --sel: #1b2634;
    --crit: #f07a6e; --crit-soft: #3a1d1b; --imp: #e5a94a; --imp-soft: #36290f; --supp: #9aa8b8; --supp-soft: #222b35;
    --ok: #5cc48c; --ok-soft: #15301f; --vt: #b393ef; --vt-soft: #291f3d;
    --mon-bg: #070a0e; --mon-line: #1e2630; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #161d25; --ink: #e6ebf1; --ink-2: #b4c0cd; --muted: #8593a3;
  --line: #26303b; --line-2: #34404d; --accent: #6ea8f2; --accent-soft: #1a2a40; --sel: #1b2634;
  --crit: #f07a6e; --crit-soft: #3a1d1b; --imp: #e5a94a; --imp-soft: #36290f; --supp: #9aa8b8; --supp-soft: #222b35;
  --ok: #5cc48c; --ok-soft: #15301f; --vt: #b393ef; --vt-soft: #291f3d;
  --mon-bg: #070a0e; --mon-line: #1e2630; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }

.app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }

/* ---------- Library rail ---------- */
.rail { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.rail-head { padding: 18px 16px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; }
.brand h1 { font-size: 20px; font-weight: 700; letter-spacing: .01em; line-height: 1.1; }
.brand small { display: block; font: 600 11px/1.2 var(--body); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.search { width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 4px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.filters { display: flex; gap: 8px; }
.filters select { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; }
.count { font-size: 12px; color: var(--muted); }
.list { overflow-y: auto; flex: 1; min-height: 0; }
.group-h { position: sticky; top: 0; z-index: 1; background: var(--surface); padding: 10px 16px 6px; font: 700 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
.item { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 9px 16px; border: 0; border-bottom: 1px solid var(--line); background: transparent; width: 100%; text-align: left; cursor: pointer; }
.item:hover { background: var(--sel); }
.item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.item .id { font: 600 12px/1.6 var(--mono); color: var(--muted); grid-row: span 2; min-width: 62px; }
.item .nm { font-weight: 600; font-size: 14px; line-height: 1.3; }
.item .sub { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.dots { display: inline-flex; gap: 2px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); }
.dots i.on { background: var(--ink-2); }
.empty { padding: 24px 16px; color: var(--muted); }

/* ---------- Scenario sheet ---------- */
.main { overflow-y: auto; min-height: 0; }
.sheet { max-width: 1180px; margin: 0 auto; padding: 24px 28px 64px; display: grid; gap: 22px; }
.back { display: none; }
.hdr { display: grid; gap: 8px; }
.hdr-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--supp-soft); color: var(--ink-2); white-space: nowrap; }
.tag.mono { font-family: var(--mono); font-weight: 600; }
.tag.beginner { background: var(--ok-soft); color: var(--ok); }
.tag.intermediate { background: var(--imp-soft); color: var(--imp); }
.tag.advanced { background: var(--crit-soft); color: var(--crit); }
.hdr h2 { font-size: clamp(26px, 3.2vw, 36px); font-weight: 700; line-height: 1.08; }
.cc { font-size: 17px; color: var(--ink-2); max-width: 75ch; margin: 0; }
.hdr-links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.hdr-links a { color: var(--accent); text-decoration: none; font-weight: 600; }
.hdr-links a:hover { text-decoration: underline; }
.protos { display: flex; gap: 6px; flex-wrap: wrap; }
.protos .tag { background: var(--accent-soft); color: var(--accent); font-family: var(--mono); font-weight: 400; font-size: 11.5px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.card > h3, .sec-h { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.card > h3 { padding: 12px 16px 0; }
.card-b { padding: 10px 16px 16px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
dl.kv dt { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
dl.kv dd { margin: 0; }
.pt-strip { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 10px; }
.pt-strip div { display: grid; }
.pt-strip b { font: 600 18px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.pt-strip span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.prose { max-width: 75ch; margin: 0; }
ul.tight { margin: 0; padding-left: 18px; }
ul.tight li + li { margin-top: 2px; }
details.more summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 13px; margin-top: 8px; }
.dispatch { font-family: var(--mono); font-size: 13.5px; background: var(--bg); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 0 6px 6px 0; margin-bottom: 10px; }

/* ---------- Phase map ---------- */
.flow-wrap { overflow-x: auto; padding: 4px 16px 12px; }
.flow { display: block; }
.flow .node rect { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.5; }
.flow .node { cursor: pointer; }
.flow .node:hover rect { stroke: var(--accent); }
.flow .node.sel rect { fill: var(--accent); stroke: var(--accent); }
.flow .node.sel text { fill: #fff; }
.flow .node text { fill: var(--ink); font: 600 12.5px var(--body); }
.flow .node text.n { font: 600 10.5px var(--mono); fill: var(--muted); }
.flow .node.sel text.n { fill: #dbe7fa; }
.flow .node.start rect { stroke-width: 2.5; }
.flow .edge { fill: none; stroke-width: 1.6; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); padding: 0 16px 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 0; border-top: 2px solid; }
.c-taken { color: var(--ok); stroke: var(--ok); }
.c-not { color: var(--crit); stroke: var(--crit); }
.c-vital { color: var(--vt); stroke: var(--vt); }
.c-time { color: var(--muted); stroke: var(--muted); }
.legend i.dash { border-top-style: dashed; }

/* ---------- Phase tabs ---------- */
.ptabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.ptab { flex: none; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink-2); display: inline-flex; gap: 8px; align-items: center; }
.ptab .n { font: 600 11px var(--mono); color: var(--muted); }
.ptab[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.ptab[aria-selected="true"] .n { color: var(--line-2); }

.phase { display: grid; gap: 16px; }
.phase-h { display: grid; gap: 6px; }
.phase-h h3 { font-size: 24px; font-weight: 700; }
.trigger { background: var(--imp-soft); border-radius: 8px; padding: 10px 14px; font-size: 14px; max-width: 90ch; }
.trigger b { color: var(--imp); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; display: block; }

/* ---------- Monitor ---------- */
.monitor { background: var(--mon-bg); border-radius: 10px; color: #dfe6ee; padding: 12px 14px 14px; border: 1px solid var(--mon-line); }
.mon-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font: 400 12px var(--mono); color: var(--mon-dim); margin-bottom: 6px; flex-wrap: wrap; }
.mon-top .rhythm { color: #38e07b; font-weight: 600; font-size: 13px; }
.ecg { width: 100%; height: 54px; display: block; margin-bottom: 8px; }
.ecg path { fill: none; stroke: #38e07b; stroke-width: 1.6; }
.vitals { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 1px; background: var(--mon-line); border: 1px solid var(--mon-line); border-radius: 6px; overflow: hidden; }
.v { background: var(--mon-bg); padding: 8px 10px; display: grid; gap: 0; }
.v .l { font: 600 11px var(--mono); letter-spacing: .06em; }
.v .val { font: 600 30px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.v .u { font: 400 11px var(--mono); color: var(--mon-dim); }
.v.off .val { color: var(--mon-dim) !important; font-size: 22px; }
.v.hr { color: #38e07b; } .v.bp { color: #ff6b6b; } .v.spo2 { color: #3fd0f0; } .v.rr { color: #f2f2f2; }
.v.co2 { color: #f5d547; } .v.temp { color: #c99bff; } .v.glu { color: #ff9f43; } .v.cust { color: #9be7c4; }
.v .delta { font: 400 11px var(--mono); }
.delta.up::before { content: "▲ "; } .delta.down::before { content: "▼ "; }

/* ---------- Presentation ---------- */
.speech { font-size: 16px; font-style: italic; border-left: 3px solid var(--line-2); padding: 2px 0 2px 12px; color: var(--ink-2); margin: 0 0 12px; max-width: 75ch; }
.abc { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px 18px; margin-bottom: 12px; }
.abc div b { display: block; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.findings { margin: 0; padding-left: 18px; }
.findings li { margin-top: 3px; }

/* ---------- Actions ---------- */
.actions { display: grid; gap: 6px; }
.act { border: 1px solid var(--line); border-left: 4px solid var(--supp); border-radius: 6px; background: var(--surface); }
.act.critical { border-left-color: var(--crit); }
.act.important { border-left-color: var(--imp); }
.act.hl { box-shadow: 0 0 0 2px var(--accent); }
.act summary { list-style: none; cursor: pointer; padding: 8px 12px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
.act summary::-webkit-details-marker { display: none; }
.act summary .t { font-weight: 600; }
.act summary .t::before { content: "▸"; display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
.act[open] summary .t::before { transform: rotate(90deg); }
.pri { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 1px 7px; border-radius: 4px; }
.pri.critical { background: var(--crit-soft); color: var(--crit); }
.pri.important { background: var(--imp-soft); color: var(--imp); }
.pri.supplemental { background: var(--supp-soft); color: var(--supp); }
.act-b { padding: 0 12px 12px 26px; display: grid; gap: 8px; font-size: 14px; }
.act-b .ref { font-size: 12px; font-weight: 700; color: var(--accent); }
.excerpt { background: var(--bg); border-radius: 6px; padding: 8px 12px; font-size: 13.5px; color: var(--ink-2); white-space: pre-line; }
.act-id { font: 400 11px var(--mono); color: var(--muted); }

/* ---------- Transitions ---------- */
.trans { display: grid; gap: 8px; }
.tr { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; background: var(--surface); }
.tr-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.tr-if { font-weight: 700; }
.ctype { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 1px 7px; border-radius: 4px; }
.ctype.action_taken { background: var(--ok-soft); color: var(--ok); }
.ctype.action_not_taken { background: var(--crit-soft); color: var(--crit); }
.ctype.vital_threshold { background: var(--vt-soft); color: var(--vt); }
.ctype.time_elapsed { background: var(--supp-soft); color: var(--supp); }
.go { border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 6px; padding: 3px 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.go:hover { background: var(--accent); color: #fff; }
.tr p { margin: 0; font-size: 14px; color: var(--ink-2); max-width: 90ch; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: 400 11.5px var(--mono); border: 1px dashed var(--line-2); border-radius: 4px; padding: 1px 6px; background: transparent; cursor: pointer; color: var(--ink-2); }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.endnote { color: var(--muted); font-size: 14px; }

/* ---------- Vitals table ---------- */
.tbl-wrap { overflow-x: auto; }
table.vt { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.vt th, table.vt td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.vt th:first-child, table.vt td:first-child, table.vt td.rh { text-align: left; }
table.vt thead th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
table.vt tbody tr { cursor: pointer; }
table.vt tbody tr:hover { background: var(--sel); }
table.vt tbody tr.sel { background: var(--accent-soft); }
table.vt td.rh { white-space: normal; min-width: 140px; color: var(--ink-2); }
.dim { color: var(--muted); }

.loading { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 15px; }

@media (max-width: 1000px) { .two { grid-template-columns: 1fr; } }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .app.has-sel .rail { display: none; }
  .app:not(.has-sel) .main { display: none; }
  .back { display: inline-flex; border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; cursor: pointer; }
  .sheet { padding: 16px 16px 48px; }
  .abc { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail" aria-label="Scenario library">
    <div class="rail-head">
      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><g fill="var(--accent)" transform="translate(15 15)"><rect x="-3.4" y="-13" width="6.8" height="26" rx="1"/><rect x="-3.4" y="-13" width="6.8" height="26" rx="1" transform="rotate(60)"/><rect x="-3.4" y="-13" width="6.8" height="26" rx="1" transform="rotate(-60)"/></g><path d="M15 7v16M13 10c4 0 4 3 0 3s-4 3 0 3 4 3 0 3" stroke="#fff" stroke-width="1.3" fill="none"/></svg>
        <div><h1>Scenario Viewer</h1><small>MATC Paramedic Program</small></div>
      </div>
      <input id="q" class="search" type="search" placeholder="Search name, ID, tag, complaint, protocol" aria-label="Search scenarios">
      <div class="seg" role="group" aria-label="Collection">
        <button type="button" data-col="all" aria-pressed="true">All</button>
        <button type="button" data-col="sim-lab" aria-pressed="false">Sim Lab</button>
        <button type="button" data-col="main-lab" aria-pressed="false">Main Lab</button>
      </div>
      <div class="filters">
        <select id="cat" aria-label="Category"><option value="">All categories</option></select>
        <select id="diff" aria-label="Difficulty">
          <option value="">All levels</option>
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>
      <div class="count" id="count"></div>
      <div class="count" id="build"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main class="main" id="main"><div class="loading">Loading scenarios…</div></main>
</div>

<script id="data" type="application/octet-stream">__DATA__</script>
<script>window.VIEWER_CONFIG = __CONFIG__;</script>
<script>
(function () {
  const CFG = window.VIEWER_CONFIG || {};
  const REPO_URL = 'https://github.com/' + (CFG.repo || 'matc-ems/scenarios');
  const BRANCH = CFG.branch || 'main';
  const REPO = REPO_URL + '/tree/' + BRANCH + '/';
  const PAGES = (CFG.pagesUrl || '').replace(/\/?$/, '/');
  const state = { all: [], byId: {}, col: 'all', cat: '', diff: '', q: '', sel: null, phase: 0 };
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const DIFF_N = { beginner: 1, intermediate: 2, advanced: 3 };
  const CTYPE = { action_taken: 'Action taken', action_not_taken: 'Action missed', vital_threshold: 'Vital threshold', time_elapsed: 'Time elapsed' };
  const CCLASS = { action_taken: 'c-taken', action_not_taken: 'c-not', vital_threshold: 'c-vital', time_elapsed: 'c-time' };
  const primaryCat = s => (s.meta.category || 'Other').split('/')[0].trim();
  const fmtTime = s => { if (!s && s !== 0) return '—'; const m = Math.round(s / 60); return m + ' min'; };

  async function load() {
    const b64 = $('#data').textContent.trim();
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    const txt = await new Response(stream).text();
    return JSON.parse(txt);
  }

  function searchText(s) {
    const m = s.meta, p = s.patient;
    return [m.id, m.name, m.category, (m.tags || []).join(' '), (m.protocols || []).join(' '), p.chiefComplaint, p.history && p.history.hpi].join(' ').toLowerCase();
  }

  function filtered() {
    const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    return state.all.filter(s =>
      (state.col === 'all' || s._col === state.col) &&
      (!state.cat || s._cat === state.cat) &&
      (!state.diff || s.meta.difficulty === state.diff) &&
      words.every(w => s._text.includes(w)));
  }

  function renderList() {
    const rows = filtered();
    $('#count').textContent = rows.length + ' of ' + state.all.length + ' scenarios';
    if (!rows.length) { $('#list').innerHTML = '<div class="empty">No scenarios match. Clear the search or pick another category.</div>'; return; }
    let html = '';
    ['sim-lab', 'main-lab'].forEach(col => {
      const g = rows.filter(s => s._col === col);
      if (!g.length) return;
      html += '<div class="group-h">' + (col === 'sim-lab' ? 'Sim Lab' : 'Main Lab') + ' · ' + g.length + '</div>';
      g.forEach(s => {
        const m = s.meta, n = DIFF_N[m.difficulty] || 0;
        const name = s._col === 'main-lab' ? m.name.replace(/^\d+\s*-\s*/, '') : m.name;
        const shortId = s._col === 'main-lab' ? m.id.split('-')[0] : m.id;
        html += '<button class="item" data-id="' + esc(m.id) + '"' + (state.sel === m.id ? ' aria-current="true"' : '') + '>' +
          '<span class="id">' + esc(shortId) + '</span>' +
          '<span class="nm">' + esc(name) + '</span>' +
          '<span class="sub"><span class="dots" title="' + esc(m.difficulty) + '"><i class="' + (n >= 1 ? 'on' : '') + '"></i><i class="' + (n >= 2 ? 'on' : '') + '"></i><i class="' + (n >= 3 ? 'on' : '') + '"></i></span>' +
          esc(m.category) + ' · ' + s.phases.length + ' phases</span></button>';
      });
    });
    $('#list').innerHTML = html;
  }

  /* ---------- Phase map layout ---------- */
  function layout(phases) {
    const idx = {}; phases.forEach((p, i) => idx[p.id] = i);
    const start = Math.max(0, phases.findIndex(p => p.isDefault));
    const depth = phases.map(() => -1); depth[start] = 0;
    const queue = [start];
    while (queue.length) {
      const i = queue.shift();
      (phases[i].transitions || []).forEach(t => {
        const j = idx[t.targetPhaseId];
        if (j != null && depth[j] < 0) { depth[j] = depth[i] + 1; queue.push(j); }
      });
    }
    let maxD = Math.max(0, ...depth);
    depth.forEach((d, i) => { if (d < 0) depth[i] = ++maxD; });
    const layers = []; depth.forEach((d, i) => (layers[d] = layers[d] || []).push(i));
    return { depth, layers: layers.filter(Boolean), idx, start };
  }

  function wrapText(t, max) {
    const words = t.split(/\s+/), lines = []; let cur = '';
    words.forEach(w => { if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
    if (cur) lines.push(cur);
    if (lines.length > 3) { lines.length = 3; lines[2] = lines[2].replace(/.{0,2}$/, '…'); }
    return lines;
  }

  function flowSVG(s) {
    const P = s.phases, L = layout(P);
    const NW = 168, NH = 64, GX = 64, GY = 16;
    const maxRows = Math.max(...L.layers.map(l => l.length));
    const H = maxRows * NH + (maxRows - 1) * GY + 16;
    const W = L.layers.length * NW + (L.layers.length - 1) * GX + 16;
    const pos = {};
    L.layers.forEach((layer, c) => {
      const colH = layer.length * NH + (layer.length - 1) * GY;
      const y0 = (H - colH) / 2;
      layer.forEach((i, r) => pos[i] = { x: 8 + c * (NW + GX), y: y0 + r * (NH + GY) });
    });
    let edges = '', nodes = '';
    P.forEach((p, i) => (p.transitions || []).forEach(t => {
      const j = L.idx[t.targetPhaseId]; if (j == null) return;
      const a = pos[i], b = pos[j], cls = CCLASS[t.conditionType] || 'c-time';
      const dash = t.conditionType === 'action_not_taken' ? ' stroke-dasharray="5 4"' : '';
      let d;
      if (b.x > a.x) {
        const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x - 6, y2 = b.y + NH / 2, mx = (x1 + x2) / 2;
        d = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
      } else {
        const x1 = a.x + NW / 2, y1 = a.y + NH, x2 = b.x + NW / 2, y2 = b.y + NH + 6, low = Math.max(y1, y2) + 26;
        d = `M${x1},${y1} C${x1},${low} ${x2},${low} ${x2},${y2}`;
      }
      edges += `<path class="edge ${cls}" d="${d}"${dash} marker-end="url(#ar-${cls})"><title>${esc(t.if || '')}</title></path>`;
    }));
    P.forEach((p, i) => {
      const { x, y } = pos[i];
      const lines = wrapText(p.name, 24);
      const ty = y + NH / 2 - (lines.length - 1) * 7 + 9;
      nodes += `<g class="node${i === state.phase ? ' sel' : ''}${i === L.start ? ' start' : ''}" data-ph="${i}" tabindex="0" role="button" aria-label="Phase ${i + 1}: ${esc(p.name)}">` +
        `<rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="8"/>` +
        `<text class="n" x="${x + 10}" y="${y + 14}">${i === L.start ? 'START' : 'P' + (i + 1)}</text>` +
        lines.map((ln, k) => `<text x="${x + NW / 2}" y="${ty + k * 14}" text-anchor="middle">${esc(ln)}</text>`).join('') + '</g>';
    });
    const markers = Object.values(CCLASS).map(c => `<marker id="ar-${c}" class="${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:currentColor;stroke:none"/></marker>`).join('');
    const backPad = P.some((p, i) => (p.transitions || []).some(t => { const j = L.idx[t.targetPhaseId]; return j != null && pos[j].x <= pos[i].x; })) ? 34 : 0;
    return `<svg class="flow" width="${W}" height="${H + backPad}" viewBox="0 0 ${W} ${H + backPad}"><defs>${markers}</defs>${edges}${nodes}</svg>`;
  }

  /* ---------- Monitor ---------- */
  const ECG_SHAPES = {
    flat: () => 'M0,30 L600,30',
    vf: () => { let d = 'M0,30'; for (let x = 0; x <= 600; x += 6) d += ` L${x},${30 + Math.sin(x / 9) * 12 + Math.sin(x / 3.7) * 7}`; return d; },
    beat: (hr, wide) => {
      const per = Math.max(32, Math.min(200, 600 / (hr / 60 * 4))); let d = 'M0,30', x = 0;
      while (x < 600) {
        const w = wide ? 22 : 10;
        d += ` L${x + per * .3},30 q4,-6 8,0 L${x + per * .5},30 l3,4 l${w / 2},-24 l${w / 2},30 l3,-10 L${x + per * .5 + w + 14},30 q8,-9 16,0 L${x + per},30`;
        x += per;
      }
      return d;
    }
  };
  function ecgPath(ms) {
    const r = (ms.ecgRhythm || '').toLowerCase();
    if (/asystole|pea|pulseless electrical/.test(r) && !/vt|vf/.test(r)) return /pea|pulseless electrical/.test(r) ? ECG_SHAPES.beat(ms.hr || 40, false) : ECG_SHAPES.flat();
    if (/fibrillation/.test(r) && /ventric|vf/.test(r) || /\bvf\b/.test(r)) return ECG_SHAPES.vf();
    return ECG_SHAPES.beat(ms.hr || 60, /wide|vt|ventricular tach|bundle|paced|torsade|wpw|pre-excit/.test(r));
  }
  function deltaHTML(cur, prev, key) {
    if (!prev || prev[key] == null || cur[key] == null || prev[key] === cur[key]) return '';
    const d = cur[key] - prev[key];
    return `<span class="delta ${d > 0 ? 'up' : 'down'}">${Math.abs(Math.round(d * 10) / 10)} vs start</span>`;
  }
  function monitorHTML(s, i) {
    const ms = s.phases[i].monitorState || {}, vis = ms.visibility || {};
    const base = i === startIndex(s) ? null : s.phases[startIndex(s)].monitorState;
    const tile = (cls, label, val, unit, on = true, dkey) =>
      `<div class="v ${cls}${on ? '' : ' off'}"><span class="l">${label}</span><span class="val">${on ? val : '-?-'}</span><span class="u">${on ? unit : 'not attached'}</span>${on && dkey ? deltaHTML(ms, base, dkey) : ''}</div>`;
    const hasBP = ms.bpSys != null && (ms.bpSys > 0 || ms.bpDia > 0);
    const map = hasBP ? Math.round((ms.bpSys + 2 * ms.bpDia) / 3) : null;
    let t = tile('hr', 'HR', ms.hr ?? '—', 'bpm', true, 'hr') +
      tile('bp', 'NIBP', hasBP ? `${ms.bpSys}/${ms.bpDia}` : '—', hasBP ? `mmHg · MAP ${map}` : 'mmHg', true, 'bpSys') +
      tile('spo2', 'SpO₂', ms.spo2 ?? '—', '%', vis.spo2Visible !== false && vis.spo2Attached !== false, 'spo2') +
      tile('rr', 'RESP', ms.respRate ?? '—', '/min', vis.rrVisible !== false, 'respRate') +
      tile('co2', 'EtCO₂', ms.etco2 ?? '—', 'mmHg', vis.etco2Visible !== false, 'etco2') +
      tile('temp', 'TEMP', ms.tempF != null ? ms.tempF : '—', ms.temp != null ? `°F · ${ms.temp} °C` : '°F');
    if (ms.glucose != null) t += tile('glu', 'BGL', ms.glucose, 'mg/dL', true, 'glucose');
    (ms.customMeasures || []).forEach(c => t += tile('cust', esc(c.label).toUpperCase(), esc(c.value), ''));
    const meta = [];
    if (ms.obstruction) meta.push(`Airway obstruction ${ms.obstruction}%`);
    if (ms.trendTimeSeconds) meta.push(`Trend ${ms.trendTimeSeconds}s`);
    return `<div class="monitor" aria-label="Monitor state for this phase">
      <div class="mon-top"><span class="rhythm">${esc(ms.ecgRhythm || '—')}</span><span>${meta.map(esc).join(' · ')}</span></div>
      <svg class="ecg" viewBox="0 0 600 54" preserveAspectRatio="none" aria-hidden="true"><path d="${ecgPath(ms)}" vector-effect="non-scaling-stroke"/></svg>
      <div class="vitals">${t}</div></div>`;
  }
  const startIndex = s => Math.max(0, s.phases.findIndex(p => p.isDefault));

  /* ---------- Phase detail ---------- */
  function phaseHTML(s, i) {
    const p = s.phases[i], cp = p.clinicalPresentation || {}, gcs = cp.gcs || {}, skin = cp.skin || {};
    const gcsT = (gcs.eye || 0) + (gcs.verbal || 0) + (gcs.motor || 0);
    const acts = p.expectedActions || [];
    const actIds = new Set(acts.map(a => a.id));
    const trans = p.transitions || [];
    const L = layout(s.phases);
    let h = `<div class="phase" id="phase">`;
    h += `<div class="phase-h"><h3>${esc(p.name)}</h3><p class="prose">${esc(p.description)}</p>`;
    if (p.triggerCondition) h += `<div class="trigger"><b>How the patient got here</b>${esc(p.triggerCondition)}</div>`;
    h += `</div>`;
    h += monitorHTML(s, i);
    h += `<div class="two"><section class="card"><h3>Clinical presentation</h3><div class="card-b">`;
    if (cp.patientSpeech && !/^(none|n\/a|—|-)\.?$/i.test(cp.patientSpeech.trim())) h += `<p class="speech">“${esc(cp.patientSpeech)}”</p>`;
    h += `<div class="abc">
      <div><b>Mental status</b>${esc(cp.avpu)} · GCS ${gcsT} (E${gcs.eye ?? '?'} V${gcs.verbal ?? '?'} M${gcs.motor ?? '?'})</div>
      <div><b>Airway</b>${esc(cp.airway)}</div>
      <div><b>Breathing</b>${esc(cp.breathing)}</div>
      <div><b>Circulation</b>${esc(cp.circulation)}</div>
      <div><b>Skin</b>${esc([skin.color, skin.temperature, skin.moisture].filter(Boolean).join(', '))}</div>
      <div><b>Pupils</b>${esc(cp.pupils)}</div>
      <div><b>Motor</b>${esc(cp.motorFunction)}</div></div>`;
    if ((cp.otherFindings || []).length) h += `<b class="sec-h">Other findings</b><ul class="findings">${cp.otherFindings.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`;
    h += `</div></section>`;

    h += `<section class="card"><h3>Expected actions · ${acts.length}</h3><div class="card-b"><div class="actions">`;
    h += acts.length ? acts.map(a => `<details class="act ${esc(a.priority)}" data-act="${esc(a.id)}"><summary><span class="t">${esc(a.shortAction)}</span><span class="pri ${esc(a.priority)}">${esc(a.priority)}</span></summary>
      <div class="act-b">${a.rationale ? `<div>${esc(a.rationale)}</div>` : ''}${a.protocolReference ? `<div class="ref">${esc(a.protocolReference)}</div>` : ''}${a.protocolExcerpt ? `<div class="excerpt">${esc(a.protocolExcerpt)}</div>` : ''}<div class="act-id">id: ${esc(a.id)}</div></div></details>`).join('')
      : '<div class="endnote">No actions listed for this phase.</div>';
    h += `</div></div></section></div>`;

    h += `<section class="card"><h3>Where it goes next</h3><div class="card-b"><div class="trans">`;
    if (!trans.length) h += `<div class="endnote">End state. The scenario has no transitions out of this phase.</div>`;
    trans.forEach(t => {
      const j = L.idx[t.targetPhaseId], target = j != null ? s.phases[j] : null;
      const chips = (t.triggerActionIds || []).map(id => `<button class="chip" data-hl="${esc(id)}" title="${actIds.has(id) ? 'Highlight this action above' : 'Action not listed in this phase'}">${esc(id)}</button>`).join('');
      h += `<div class="tr"><div class="tr-top"><span><span class="ctype ${esc(t.conditionType)}">${esc(CTYPE[t.conditionType] || t.conditionType)}</span> <span class="tr-if">${esc(t.if)}</span></span>
        ${target ? `<button class="go" data-ph="${j}">Go to P${j + 1}: ${esc(target.name)} →</button>` : ''}</div>
        <p>${esc(t.condition)}</p>${t.timeoutSeconds ? `<div class="act-id">Timeout: ${t.timeoutSeconds}s (${fmtTime(t.timeoutSeconds)})</div>` : ''}${chips ? `<div class="chips">${chips}</div>` : ''}</div>`;
    });
    h += `</div></div></section></div>`;
    return h;
  }

  function vitalsTable(s) {
    const cols = [['HR', m => m.hr], ['BP', m => (m.bpSys || m.bpDia) ? `${m.bpSys}/${m.bpDia}` : '—'], ['RR', m => m.respRate], ['SpO₂', m => m.visibility && m.visibility.spo2Visible === false ? '<span class="dim">—</span>' : m.spo2], ['EtCO₂', m => m.visibility && m.visibility.etco2Visible === false ? `<span class="dim">${m.etco2 ?? '—'}</span>` : m.etco2], ['BGL', m => m.glucose ?? '—'], ['Temp °F', m => m.tempF]];
    let h = `<div class="tbl-wrap"><table class="vt"><thead><tr><th>Phase</th><th style="text-align:left">Rhythm</th>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>`;
    s.phases.forEach((p, i) => {
      const m = p.monitorState || {};
      h += `<tr data-ph="${i}" class="${i === state.phase ? 'sel' : ''}"><td><b>P${i + 1}</b> ${esc(p.name)}</td><td class="rh">${esc(m.ecgRhythm)}</td>${cols.map(c => `<td>${c[1](m) ?? '—'}</td>`).join('')}</tr>`;
    });
    return h + `</tbody></table></div>`;
  }

  function renderScenario() {
    const s = state.byId[state.sel];
    const main = $('#main');
    $('#app').classList.toggle('has-sel', !!s);
    if (!s) { main.innerHTML = '<div class="loading">Pick a scenario from the list.</div>'; return; }
    const m = s.meta, p = s.patient, h = p.history || {}, sc = s.scene || {};
    const age = `${p.age} ${p.ageUnit && p.ageUnit !== 'years' ? p.ageUnit : 'y'}`;
    let html = `<div class="sheet"><button class="back" id="back">← All scenarios</button>
      <header class="hdr"><div class="hdr-top"><span class="tag mono">${esc(m.id)}</span><span class="tag">${s._col === 'sim-lab' ? 'Sim Lab' : 'Main Lab'}</span><span class="tag">${esc(m.category)}</span><span class="tag ${esc(m.difficulty)}">${esc(m.difficulty)}</span><span class="tag">${fmtTime(m.totalTimeSeconds)}</span><span class="tag">${s.phases.length} phases</span></div>
      <h2>${esc(m.name)}</h2><p class="cc">${esc(p.chiefComplaint)}</p>
      <div class="protos">${(m.protocols || []).map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>
      <div class="hdr-links">${PAGES !== '/' ? `<a href="${PAGES}${s._col}/${encodeURIComponent(m.id)}/index.html" target="_blank" rel="noopener">Open scenario player ↗</a><a href="${PAGES}${s._col}/${encodeURIComponent(m.id)}/printable.html" target="_blank" rel="noopener">Printable handout ↗</a>` : ''}<a href="${REPO}${s._col}/${encodeURIComponent(m.id)}" target="_blank" rel="noopener">Scenario folder on GitHub ↗</a><a href="${REPO_URL}/blob/${BRANCH}/${s._col}/${encodeURIComponent(m.id)}/unified.json" target="_blank" rel="noopener">unified.json ↗</a></div></header>
      <div class="two">
        <section class="card"><h3>Dispatch &amp; scene</h3><div class="card-b">
          <div class="dispatch">${esc(sc.dispatch)}</div>
          <dl class="kv"><dt>Location</dt><dd>${esc(sc.location)}</dd><dt>Time</dt><dd>${esc(sc.time)}</dd><dt>Safety</dt><dd>${esc(sc.safety)}</dd><dt>Bystanders</dt><dd>${esc(sc.bystanders)}</dd></dl>
          ${(sc.visualCues || []).length ? `<details class="more"><summary>Visual cues for moulage &amp; setup (${sc.visualCues.length})</summary><ul class="tight">${sc.visualCues.map(v => `<li>${esc(v)}</li>`).join('')}</ul></details>` : ''}
        </div></section>
        <section class="card"><h3>Patient</h3><div class="card-b">
          <div class="pt-strip"><div><span>Name</span><b>${esc(p.name)}</b></div><div><span>Age / sex</span><b>${esc(age)} ${esc((p.sex || '').charAt(0).toUpperCase())}</b></div><div><span>Weight</span><b>${p.weight} kg</b></div><div><span></span><b class="dim">${p.weightLbs} lb</b></div>${p.height ? `<div><span>Height</span><b>${p.height} cm</b></div>` : ''}</div>
          <dl class="kv"><dt>Allergies</dt><dd>${esc((h.allergies || []).join(', ') || '—')}</dd><dt>PMH</dt><dd>${esc((h.pastMedical || []).join('; ') || '—')}</dd><dt>Meds</dt><dd><ul class="tight" style="padding-left:16px">${(h.medications || []).map(x => `<li>${esc(x)}</li>`).join('') || '—'}</ul></dd><dt>Last intake</dt><dd>${esc(h.lastOralIntake)}</dd></dl>
          <details class="more"><summary>HPI &amp; events</summary><p class="prose" style="margin-top:6px">${esc(h.hpi)}</p>${h.events ? `<p class="prose" style="margin-top:6px"><b>Events:</b> ${esc(h.events)}</p>` : ''}</details>
        </div></section>
      </div>
      <section class="card"><h3>Phase map</h3><div class="legend"><span><i class="c-taken" style="border-color:var(--ok)"></i>Action taken</span><span><i class="dash" style="border-color:var(--crit)"></i>Action missed</span><span><i style="border-color:var(--vt)"></i>Vital threshold</span><span><i style="border-color:var(--muted)"></i>Time elapsed</span><span>Click a phase to open it</span></div><div class="flow-wrap" id="flow"></div></section>
      <div class="ptabs" role="tablist" id="ptabs"></div>
      <div id="phasebox"></div>
      <section class="card"><h3>Vitals by phase</h3><div class="card-b" id="vtable"></div></section>
    </div>`;
    main.innerHTML = html;
    main.scrollTop = 0;
    renderPhase(false);
  }

  function renderPhase(scroll) {
    const s = state.byId[state.sel]; if (!s) return;
    $('#flow').innerHTML = flowSVG(s);
    $('#ptabs').innerHTML = s.phases.map((p, i) => `<button class="ptab" role="tab" data-ph="${i}" aria-selected="${i === state.phase}"><span class="n">P${i + 1}</span>${esc(p.name)}</button>`).join('');
    $('#phasebox').innerHTML = phaseHTML(s, state.phase);
    $('#vtable').innerHTML = vitalsTable(s);
    if (scroll) { const t = $('#ptabs'); const top = t.getBoundingClientRect().top + $('#main').scrollTop - 12; if (t.getBoundingClientRect().top < 0 || t.getBoundingClientRect().top > innerHeight * .6) $('#main').scrollTo({ top, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
    const sel = $('.ptab[aria-selected="true"]'); if (sel) sel.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function select(id, fromHash) {
    if (!state.byId[id]) id = null;
    state.sel = id;
    state.phase = id ? startIndex(state.byId[id]) : 0;
    if (!fromHash) { try { if (id) location.hash = id; else history.replaceState(null, '', location.pathname); } catch (e) {} }
    try { if (id) localStorage.setItem('matc-viewer-last', id); } catch (e) {}
    document.querySelectorAll('.item').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
    renderScenario();
  }

  /* ---------- Events ---------- */
  $('#list').addEventListener('click', e => { const b = e.target.closest('.item'); if (b) select(b.dataset.id); });
  $('#q').addEventListener('input', e => { state.q = e.target.value; renderList(); });
  $('#cat').addEventListener('change', e => { state.cat = e.target.value; renderList(); });
  $('#diff').addEventListener('change', e => { state.diff = e.target.value; renderList(); });
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    state.col = b.dataset.col; document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b)); renderList();
  }));
  $('#main').addEventListener('click', e => {
    if (e.target.closest('#back')) { select(null); return; }
    const ph = e.target.closest('[data-ph]');
    if (ph) { state.phase = +ph.dataset.ph; renderPhase(!!e.target.closest('.go, .node, tr')); return; }
    const hl = e.target.closest('[data-hl]');
    if (hl) {
      const a = document.querySelector(`.act[data-act="${CSS.escape(hl.dataset.hl)}"]`);
      document.querySelectorAll('.act.hl').forEach(x => x.classList.remove('hl'));
      if (a) { a.classList.add('hl'); a.open = true; a.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    }
  });
  $('#main').addEventListener('keydown', e => {
    const n = e.target.closest('.node'); if (n && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); state.phase = +n.dataset.ph; renderPhase(true); }
  });
  addEventListener('hashchange', () => { const id = decodeURIComponent(location.hash.slice(1)); if (id !== state.sel) { select(id, true); renderList(); } });

  load().then(data => {
    state.all = data.map(s => { s._text = searchText(s); s._cat = primaryCat(s); state.byId[s.meta.id] = s; return s; });
    if (CFG.commit || CFG.builtAt) {
      const when = CFG.builtAt ? new Date(CFG.builtAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';
      $('#build').innerHTML = 'Data from <a style="color:var(--accent)" href="' + esc(REPO_URL) + (CFG.commit ? '/commit/' + esc(CFG.commit) : '') + '" target="_blank" rel="noopener">' + esc(CFG.repo || 'scenarios') + (CFG.commit ? ' @ ' + esc(CFG.commit.slice(0, 7)) : '') + '</a>' + (when ? ' · built ' + esc(when) : '');
    }
    const cats = [...new Set(state.all.map(s => s._cat))].sort();
    $('#cat').innerHTML += cats.map(c => `<option>${esc(c)}</option>`).join('');
    let id = decodeURIComponent(location.hash.slice(1));
    if (!state.byId[id]) { try { id = localStorage.getItem('matc-viewer-last'); } catch (e) { id = null; } }
    if (!state.byId[id] && innerWidth > 820) id = state.all[0].meta.id;
    state.sel = state.byId[id] ? id : null;
    renderList();
    select(state.sel, true);
    const cur = document.querySelector('.item[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'center' });
  }).catch(err => {
    $('#main').innerHTML = '<div class="loading">The scenario data could not be loaded in this browser (' + esc(err.message) + '). Try a current version of Chrome, Edge, Firefox or Safari.</div>';
  });
})();
</script>
</body>
</html>
